<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web音叉 – ギター/ベース</title>
<style>
:root {
  --bg:     #131518;
  --card:   #1c1f23;
  --bdr:    #2b2f36;
  --acc:    #c8a84b;
  --txt:    #dde0e4;
  --dim:    #727880;
  --on-bg:  #1e2b14;
  --on-bdr: #6ab030;
  --on-txt: #96d44a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  font-size: 15px;
  max-width: 420px;
  margin: 0 auto;
  padding: 32px 14px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  justify-content: center;
}

h1 {
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  letter-spacing: .08em;
  margin-bottom: 20px;
  text-align: center;
}

/* 楽器切替 */
.inst-row {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
}
.pill-btn {
  padding: 10px 28px;
  border-radius: 999px;
  border: 1.5px solid var(--bdr);
  background: var(--card);
  color: var(--dim);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.pill-btn.on {
  border-color: var(--acc);
  color: var(--acc);
}
/* モード切替：囲みなし・右寄せ */
.mode-row {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  width: 100%;
  margin-top: 4px;
}
.mode-btn {
  padding: 4px 10px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn.on {
  color: var(--txt);
}

/* 弦ボタン */
.sg {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 64px;
}
.sitem {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.sbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--bdr);
  background: var(--card);
  color: var(--txt);
  cursor: pointer;
  gap: 1px;
  transition: border-color .12s, background .12s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.sbtn:active { transform: scale(.93); }
.sbtn.on {
  border-color: var(--on-bdr);
  background: var(--on-bg);
  box-shadow: 0 0 12px rgba(106,176,48,.25);
}
.sn  { font-size: 9px;  color: var(--dim); line-height: 1; }
.sk  { font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.sbtn.on .sn { color: var(--on-txt); opacity: .8; }
.sbtn.on .sk { color: var(--on-txt); }
.sf  { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.sitem.on .sf { color: var(--on-txt); opacity: .8; }

/* コントロール */
.ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 999px;
  padding: 9px 14px;
  margin-bottom: 8px;
  width: 100%;
}
.cl { font-size: 11px; color: var(--dim); min-width: 28px; }
.cv {
  font-size: 12px;
  font-weight: 700;
  color: var(--acc);
  font-variant-numeric: tabular-nums;
  min-width: 52px;
  text-align: right;
}
.sb {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--bdr);
  background: var(--bg);
  color: var(--txt);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.sb:active { background: var(--card); }
input[type=range] {
  -webkit-appearance: none;
  flex: 1; height: 4px;
  border-radius: 2px;
  background: var(--bdr);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--acc); border: 2px solid var(--bg);
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--acc); border: 2px solid var(--bg);
}
</style>
</head>
<body>

<h1>🎸 WEB音叉</h1>

<!-- 楽器切替 -->
<div class="inst-row">
  <button class="pill-btn" id="btn-guitar" onclick="setInst('guitar')">Guitar</button>
  <button class="pill-btn" id="btn-bass"   onclick="setInst('bass')">Bass</button>
</div>

<!-- 弦ボタン -->
<div class="sg" id="sg"></div>

<!-- 音量・A4 -->
<div class="ctrl">
  <span class="cl">音量</span>
  <button class="sb" onclick="stepVol(-5)">−</button>
  <input type="range" id="volr" min="0" max="100" step="5" value="50" oninput="setVol(+this.value)">
  <button class="sb" onclick="stepVol(+5)">＋</button>
  <span class="cv" id="volv">50%</span>
</div>
<div class="ctrl">
  <span class="cl">A4</span>
  <button class="sb" onclick="stepA4(-1)">−</button>
  <input type="range" id="a4r" min="432" max="446" step="1" value="440" oninput="setA4(+this.value)">
  <button class="sb" onclick="stepA4(+1)">＋</button>
  <span class="cv" id="a4v">440 Hz</span>
</div>
<div class="mode-row">
  <button class="mode-btn" id="btn-fork" onclick="setMode('fork')">音叉</button>
  <button class="mode-btn" id="btn-open" onclick="setMode('open')">実音</button>
</div>

<script>
// ── アプリ状態 ──
const S = {
  inst:    'guitar',
  mode:    'fork',    // 'fork' | 'open'
  a4:      440,
  vol:     0.50,
  // playing: null | { id, note, oct, stringNo }
  playing: null,
};

// ── 楽器定義 ──
// open: 実際の開放弦音  / fork: 聞き取りやすい基準オクターブ音
const PRESETS = {
  guitar: [
    { n:6, label:'E', open:{note:'E',oct:2}, fork:{note:'E',oct:4} },
    { n:5, label:'A', open:{note:'A',oct:2}, fork:{note:'A',oct:4} },
    { n:4, label:'D', open:{note:'D',oct:3}, fork:{note:'D',oct:4} },
    { n:3, label:'G', open:{note:'G',oct:3}, fork:{note:'G',oct:4} },
    { n:2, label:'B', open:{note:'B',oct:3}, fork:{note:'B',oct:4} },
    { n:1, label:'E', open:{note:'E',oct:4}, fork:{note:'E',oct:4} },
  ],
  bass: [
    { n:4, label:'E', open:{note:'E',oct:1}, fork:{note:'E',oct:4} },
    { n:3, label:'A', open:{note:'A',oct:1}, fork:{note:'A',oct:4} },
    { n:2, label:'D', open:{note:'D',oct:2}, fork:{note:'D',oct:4} },
    { n:1, label:'G', open:{note:'G',oct:2}, fork:{note:'G',oct:4} },
  ],
};

// ── 周波数計算（12平均律） ──
const NM = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function calcFreq(note, oct, a4) {
  return a4 * Math.pow(2, ((NM.indexOf(note) - 9) + (oct - 4) * 12) / 12);
}

// ── 現在モードの note/oct を返す ──
function getTarget(str) {
  return S.mode === 'fork' ? str.fork : str.open;
}

// ── Web Audio ──
let ctx = null, osc = null, gain = null;

async function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
}

function _stop() {
  if (!osc && !gain) return;
  const _osc = osc, _gain = gain;
  osc = null; gain = null;
  try {
    const t = ctx.currentTime;
    _gain.gain.cancelScheduledValues(t);
    _gain.gain.setValueAtTime(_gain.gain.value, t);
    _gain.gain.linearRampToValueAtTime(0, t + 0.05);
    _osc.stop(t + 0.05);
    setTimeout(() => { try { _osc.disconnect(); _gain.disconnect(); } catch(e){} }, 200);
  } catch(e) {}
}

async function play(hz) {
  await ensureCtx();
  _stop();
  const _osc  = ctx.createOscillator();
  const _gain = ctx.createGain();
  _osc.type = 'sine';
  _osc.frequency.value = hz;
  _gain.gain.setValueAtTime(0, ctx.currentTime);
  _gain.gain.linearRampToValueAtTime(S.vol, ctx.currentTime + 0.02);
  _osc.connect(_gain);
  _gain.connect(ctx.destination);
  _osc.start();
  osc = _osc; gain = _gain;
}

function stopAll() {
  _stop();
  S.playing = null;
  drawStrings();
}

// ── 弦タップ ──
function clickStr(stringNo) {
  const str = PRESETS[S.inst].find(s => s.n === stringNo);
  if (!str) return;
  const tgt = getTarget(str);
  const id  = tgt.note + tgt.oct + '_' + str.n; // 同音名でも弦を区別
  if (S.playing && S.playing.id === id) { stopAll(); return; }
  S.playing = { id, note: tgt.note, oct: tgt.oct, stringNo: str.n };
  play(calcFreq(tgt.note, tgt.oct, S.a4));
  drawStrings();
}

// ── 楽器・モード切替 ──
function setInst(v) {
  if (S.inst === v) return;
  stopAll();
  S.inst = v;
  save(); draw();
}
function setMode(v) {
  if (S.mode === v) return;
  stopAll();
  S.mode = v;
  save(); draw();
}

// ── A4 ──
function setA4(v) {
  S.a4 = v;
  document.getElementById('a4r').value = v;
  document.getElementById('a4v').textContent = v + ' Hz';
  // 再生中の音程をなめらかに更新（モードに合った note/oct を使う）
  if (osc && S.playing) {
    osc.frequency.setTargetAtTime(
      calcFreq(S.playing.note, S.playing.oct, v),
      ctx.currentTime, 0.01
    );
  }
  drawStrings();
  save();
}
function stepA4(d) { setA4(Math.min(446, Math.max(432, S.a4 + d))); }

// ── 音量 ──
function setVol(v) {
  S.vol = v / 100;
  document.getElementById('volr').value = v;
  document.getElementById('volv').textContent = v + '%';
  if (gain) {
    const t = ctx.currentTime;
    // cancelで前のスケジュールを破棄してから指数追従
    // setTargetAtTime は連続呼び出しでも衝突しないのでノイズが出ない
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.setTargetAtTime(S.vol, t, 0.03);
  }
  save();
}
function stepVol(d) {
  const v = Math.min(100, Math.max(0, Math.round(S.vol * 100) + d));
  setVol(v);
  document.getElementById('volr').value = v;
}

// ── 描画 ──
function drawStrings() {
  document.getElementById('sg').innerHTML = PRESETS[S.inst].map(str => {
    const tgt = getTarget(str);
    const id  = tgt.note + tgt.oct + '_' + str.n;
    const hz  = calcFreq(tgt.note, tgt.oct, S.a4).toFixed(1);
    // 表示ラベル: モードに応じた note+oct（表示と実音を一致させる）
    const label = tgt.note + tgt.oct;
    const on  = S.playing && S.playing.id === id;
    return `<div class="sitem${on ? ' on' : ''}">
      <button class="sbtn${on ? ' on' : ''}" onclick="clickStr(${str.n})">
        <span class="sn">${str.n}弦</span>
        <span class="sk">${label}</span>
      </button>
      <span class="sf">${hz}Hz</span>
    </div>`;
  }).join('');
}

function draw() {
  document.getElementById('btn-guitar').classList.toggle('on', S.inst === 'guitar');
  document.getElementById('btn-bass').classList.toggle('on',   S.inst === 'bass');
  document.getElementById('btn-fork').classList.toggle('on',   S.mode === 'fork');
  document.getElementById('btn-open').classList.toggle('on',   S.mode === 'open');
  document.getElementById('a4r').value  = S.a4;
  document.getElementById('a4v').textContent = S.a4 + ' Hz';
  document.getElementById('volr').value = Math.round(S.vol * 100);
  document.getElementById('volv').textContent = Math.round(S.vol * 100) + '%';
  drawStrings();
}

// ── localStorage ──
const KEY = 'web-tuning-fork-v1';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ inst:S.inst, mode:S.mode, a4:S.a4, vol:S.vol }));
  } catch(e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (d.inst === 'guitar' || d.inst === 'bass')   S.inst = d.inst;
    if (d.mode === 'fork'   || d.mode === 'open')   S.mode = d.mode;
    if (typeof d.a4  === 'number' && d.a4  >= 432 && d.a4  <= 446) S.a4  = d.a4;
    if (typeof d.vol === 'number' && d.vol >= 0   && d.vol <= 1)   S.vol = d.vol;
  } catch(e) {}
}

// ── 起動 ──
load();
draw();
</script>
</body>
</html>
