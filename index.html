<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131518">
<meta name="description" content="ギター/ベースの調弦用Web音叉。音叉のA、各弦の実音・基準音を再生。A4は432〜446Hzで調整できます。音はブラウザ内で生成されます。">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎵</text></svg>'>
<title>Web音叉 – ギター/ベース</title>
<style>
:root {
  --bg:     #131518;
  --card:   #1c1f23;
  --bdr:    #2b2f36;
  --acc:    #c8a84b;
  --txt:    #dde0e4;
  --dim:    #727880;
  --on-bg:  #1e2b14;
  --on-bdr: #6ab030;
  --on-txt: #96d44a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  font-size: 15px;
  max-width: 420px;
  margin: 0 auto;
  padding: 32px 14px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  justify-content: center;
}

h1 {
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  letter-spacing: .08em;
  margin-bottom: 20px;
  text-align: center;
}

/* 楽器切替 */
.inst-row {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
}
.pill-btn {
  padding: 10px 22px;
  border-radius: 999px;
  border: 1.5px solid var(--bdr);
  background: var(--card);
  color: var(--dim);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.pill-btn.on {
  border-color: var(--acc);
  color: var(--acc);
}
/* 最下段：左にチューナーへの導線、右に基準音/実音 */
.mode-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  width: 100%;
  margin-top: 4px;
}
.notes-row { display: flex; gap: 4px; }
.mode-btn {
  padding: 4px 10px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn.on { color: var(--txt); }
.app-link {
  padding: 4px 6px;
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.app-link:hover,
.app-link:focus-visible { color: var(--acc); }
.mode-group { display: flex; gap: 4px; }
.mode-btn {
  padding: 4px 10px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn.on {
  color: var(--txt);
}

/* シンプルA：音叉そのもの */
.fork-stage {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 36px;
}
.fork-stage.show { display: flex; }
.fork-btn {
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fork-svg {
  display: block;
  width: 138px;
  height: auto;
  overflow: visible;
  transition: transform .08s;
}
.fork-btn:active .fork-svg { transform: scale(.96); }
.fork-btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 6px; border-radius: 12px; }
.fork-part {
  fill: none;
  stroke: url(#forkMetal);
  stroke-width: 13;
  stroke-linecap: round;
}
.fork-knob { fill: url(#forkMetal); stroke: none; }
/* 鳴っている間だけ叉が震える。支点は叉の根元（viewBox 座標で指定：
   直線の fill-box は幅ゼロで使えない）。 */
.fork-tine-l { transform-origin: 34px 176px; }
.fork-tine-r { transform-origin: 86px 176px; }
.fork-btn.on .fork-tine-l { animation: tineL .1s linear infinite; }
.fork-btn.on .fork-tine-r { animation: tineR .1s linear infinite; }
@keyframes tineL {
  0%, 100% { transform: rotate(-1.5deg); }
  50%      { transform: rotate(1.5deg); }
}
@keyframes tineR {
  0%, 100% { transform: rotate(1.5deg); }
  50%      { transform: rotate(-1.5deg); }
}
.fork-btn.on .fork-part { stroke: url(#forkMetalOn); }
.fork-btn.on .fork-knob { fill: url(#forkMetalOn); }
.fork-ring {
  fill: none;
  stroke: var(--on-txt);
  stroke-width: 2;
  opacity: 0;
  transform-origin: 60px 104px;
}
.fork-btn.on .fork-ring { animation: forkRing 1.6s ease-out infinite; }
.fork-btn.on .fork-ring-2 { animation-delay: .8s; }
@keyframes forkRing {
  0%   { transform: scale(.5); opacity: .5; }
  100% { transform: scale(1.6); opacity: 0; }
}
.fork-readout {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.fork-note { font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: var(--dim); }
.fork-hz   { font-size: 13px; font-weight: 700; color: var(--dim); }
.fork-stage.on .fork-note, .fork-stage.on .fork-hz { color: var(--on-txt); }
.fork-hint { font-size: 11px; color: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  .fork-btn.on .fork-tine-l,
  .fork-btn.on .fork-tine-r,
  .fork-btn.on .fork-ring { animation: none; }
  .fork-btn.on .fork-ring { opacity: .28; }
}

/* 弦ボタン */
.sg {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  /* 6 個を必ず 1 行に収める。固定 56px だと 360px 以下で両端が画面外に出て
     押せなくなっていた（320px で左端が -28px）。 */
  gap: clamp(4px, 1.6vw, 8px);
  margin-bottom: 40px;
}
.sitem {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.sbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: min(56px, calc((100vw - 64px) / 6));
  height: min(56px, calc((100vw - 64px) / 6));
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--bdr);
  background: var(--card);
  color: var(--txt);
  cursor: pointer;
  gap: 1px;
  transition: border-color .12s, background .12s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.sbtn:active { transform: scale(.93); }
.sbtn.on {
  border-color: var(--on-bdr);
  background: var(--on-bg);
  box-shadow: 0 0 12px rgba(106,176,48,.25);
}
.sn  { font-size: 9px;  color: var(--dim); line-height: 1; }
.sk  { font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.sbtn.on .sn { color: var(--on-txt); opacity: .8; }
.sbtn.on .sk { color: var(--on-txt); }
.sf  { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.sitem.on .sf { color: var(--on-txt); opacity: .8; }

/* コントロール */
.ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 999px;
  padding: 9px 14px;
  margin-bottom: 8px;
  width: 100%;
}
.cl { font-size: 11px; color: var(--dim); min-width: 28px; }
.cv {
  font-size: 12px;
  font-weight: 700;
  color: var(--acc);
  font-variant-numeric: tabular-nums;
  min-width: 52px;
  text-align: right;
}
.sb {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--bdr);
  background: var(--bg);
  color: var(--txt);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.sb:active { background: var(--card); }
input[type=range] {
  -webkit-appearance: none;
  /* range の固有最小幅は 130px 前後あり、min-width:0 がないと 320px 幅で
     音量/A4 の行がはみ出す（最小内容幅 330px）。 */
  flex: 1; min-width: 0; height: 4px;
  border-radius: 2px;
  background: var(--bdr);
  outline: none; cursor: pointer;
}
/* outline:none はつまみの見た目のためだが、キーボードでは行方が分からなく
   なるので、フォーカス時だけは必ず見えるようにする。 */
input[type=range]:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 4px;
}
.pill-btn:focus-visible,
.mode-btn:focus-visible,
.sbtn:focus-visible,
.sb:focus-visible,
.app-link:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 3px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--acc); border: 2px solid var(--bg);
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--acc); border: 2px solid var(--bg);
}
</style>
</head>
<body>
<noscript>この音叉の動作には JavaScript が必要です。</noscript>

<h1>🎸 WEB音叉</h1>

<!-- シンプルA：音叉を叩いて鳴らす -->
<div class="fork-stage" id="forkStage">
  <button class="fork-btn" id="forkBtn" type="button" onclick="clickFork()"
          aria-pressed="false" aria-label="音叉を鳴らす">
    <svg class="fork-svg" viewBox="0 0 120 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="forkMetal" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="100" y2="0">
          <stop offset="0"   stop-color="#6d747d"/>
          <stop offset=".35" stop-color="#d5dae0"/>
          <stop offset=".62" stop-color="#8d949d"/>
          <stop offset="1"   stop-color="#5c626a"/>
        </linearGradient>
        <linearGradient id="forkMetalOn" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="100" y2="0">
          <stop offset="0"   stop-color="#7d8a6a"/>
          <stop offset=".35" stop-color="#e2ecd2"/>
          <stop offset=".62" stop-color="#a3b489"/>
          <stop offset="1"   stop-color="#6b7659"/>
        </linearGradient>
      </defs>
      <circle class="fork-ring" cx="60" cy="104" r="46"/>
      <circle class="fork-ring fork-ring-2" cx="60" cy="104" r="46"/>
      <path class="fork-part fork-tine fork-tine-l" d="M34 26 L34 176"/>
      <path class="fork-part fork-tine fork-tine-r" d="M86 26 L86 176"/>
      <path class="fork-part" d="M34 176 C34 208 44 220 60 220 C76 220 86 208 86 176"/>
      <path class="fork-part" d="M60 220 L60 268"/>
      <circle class="fork-knob" cx="60" cy="278" r="11"/>
    </svg>
  </button>
  <div class="fork-readout">
    <span class="fork-note" id="forkNote">A4</span>
    <span class="fork-hz" id="forkHz">440.0 Hz</span>
  </div>
  <span class="fork-hint" id="forkHint">タップで鳴らす</span>
</div>

<!-- 楽器切替 -->
<div class="inst-row" id="inst-row">
  <button class="pill-btn" id="btn-mode" type="button" onclick="toggleFork()"
          aria-pressed="true">音叉</button>
  <button class="pill-btn" id="btn-guitar" type="button" onclick="setInst('guitar')"
          aria-pressed="false">Guitar</button>
  <button class="pill-btn" id="btn-bass" type="button" onclick="setInst('bass')"
          aria-pressed="false">Bass</button>
</div>

<!-- 弦ボタン -->
<div class="sg" id="sg"></div>

<!-- 音量・A4 -->
<div class="ctrl">
  <span class="cl" id="vol-label">音量</span>
  <button class="sb" type="button" onclick="stepVol(-5)" aria-label="音量を下げる">−</button>
  <input type="range" id="volr" min="0" max="100" step="5" value="50"
         aria-labelledby="vol-label" oninput="setVol(+this.value)">
  <button class="sb" type="button" onclick="stepVol(+5)" aria-label="音量を上げる">＋</button>
  <span class="cv" id="volv" aria-live="polite">50%</span>
</div>
<div class="ctrl">
  <span class="cl" id="a4-label">A4</span>
  <button class="sb" type="button" onclick="stepA4(-1)" aria-label="基準ピッチを下げる">−</button>
  <input type="range" id="a4r" min="432" max="446" step="1" value="440"
         aria-labelledby="a4-label" oninput="setA4(+this.value)">
  <button class="sb" type="button" onclick="stepA4(+1)" aria-label="基準ピッチを上げる">＋</button>
  <span class="cv" id="a4v" aria-live="polite">440 Hz</span>
</div>
<div class="mode-row">
  <a class="app-link" href="https://amashimacreate.github.io/tuner/"
     target="_blank" rel="noopener noreferrer">チューナー ↗</a>
  <div class="notes-row" id="notes-row">
    <button class="mode-btn" id="btn-ref" type="button" onclick="setNotes('ref')"
            aria-pressed="false">基準音</button>
    <button class="mode-btn" id="btn-real" type="button" onclick="setNotes('real')"
            aria-pressed="true">実音</button>
  </div>
</div>

<script>
// ── アプリ状態 ──
const S = {
  inst:    'guitar',
  mode:    'fork',    // 'fork' = 音叉(A のみ) | 'open' = 各弦
  notes:   'real',    // 各弦を鳴らすとき 'real' = 実音 | 'ref' = 4 オクターブの基準音
  a4:      440,
  vol:     0.50,
  // playing: null | { id, note, oct }
  playing: null,
};

// ── 楽器定義 ──
// open: 実際の開放弦音  / ref: 聞き取りやすいよう 4 オクターブに揃えた基準音
const PRESETS = {
  guitar: [
    { n:6, open:{note:'E',oct:2}, ref:{note:'E',oct:4} },
    { n:5, open:{note:'A',oct:2}, ref:{note:'A',oct:4} },
    { n:4, open:{note:'D',oct:3}, ref:{note:'D',oct:4} },
    { n:3, open:{note:'G',oct:3}, ref:{note:'G',oct:4} },
    { n:2, open:{note:'B',oct:3}, ref:{note:'B',oct:4} },
    { n:1, open:{note:'E',oct:4}, ref:{note:'E',oct:4} },
  ],
  bass: [
    { n:4, open:{note:'E',oct:1}, ref:{note:'E',oct:4} },
    { n:3, open:{note:'A',oct:1}, ref:{note:'A',oct:4} },
    { n:2, open:{note:'D',oct:2}, ref:{note:'D',oct:4} },
    { n:1, open:{note:'G',oct:2}, ref:{note:'G',oct:4} },
  ],
};

// ── 周波数計算（12平均律） ──
const NM = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function calcFreq(note, oct, a4) {
  return a4 * Math.pow(2, ((NM.indexOf(note) - 9) + (oct - 4) * 12) / 12);
}

// ── 弦の note/oct（基準音 / 実音） ──
function getTarget(str) {
  return S.notes === 'ref' ? str.ref : str.open;
}

// ── Web Audio ──
let ctx = null, osc = null, gain = null;

async function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
}

function _stop() {
  if (!osc && !gain) return;
  const _osc = osc, _gain = gain;
  osc = null; gain = null;
  try {
    const t = ctx.currentTime;
    _gain.gain.cancelScheduledValues(t);
    _gain.gain.setValueAtTime(_gain.gain.value, t);
    _gain.gain.linearRampToValueAtTime(0, t + 0.05);
    _osc.stop(t + 0.05);
    setTimeout(() => { try { _osc.disconnect(); _gain.disconnect(); } catch(e){} }, 200);
  } catch(e) {}
}

async function play(hz) {
  await ensureCtx();
  _stop();
  const _osc  = ctx.createOscillator();
  const _gain = ctx.createGain();
  _osc.type = 'sine';
  _osc.frequency.value = hz;
  _gain.gain.setValueAtTime(0, ctx.currentTime);
  _gain.gain.linearRampToValueAtTime(S.vol, ctx.currentTime + 0.02);
  _osc.connect(_gain);
  _gain.connect(ctx.destination);
  _osc.start();
  osc = _osc; gain = _gain;
}

function stopAll() {
  _stop();
  S.playing = null;
  drawSounding();
}

// ── 音叉タップ（シンプルA） ──
// 弦を選ばず A だけを鳴らす。A4 スライダーがそのまま基準になる。
const FORK_A = { note:'A', oct:4, id:'A4_fork' };

function clickFork() {
  if (S.playing && S.playing.id === FORK_A.id) { stopAll(); return; }
  S.playing = { id: FORK_A.id, note: FORK_A.note, oct: FORK_A.oct };
  play(calcFreq(FORK_A.note, FORK_A.oct, S.a4));
  drawSounding();
}

// ── 弦タップ ──
function clickStr(stringNo) {
  const str = PRESETS[S.inst].find(s => s.n === stringNo);
  if (!str) return;
  const tgt = getTarget(str);
  const id  = tgt.note + tgt.oct + '_' + str.n; // 同音名でも弦を区別
  if (S.playing && S.playing.id === id) { stopAll(); return; }
  S.playing = { id, note: tgt.note, oct: tgt.oct };
  play(calcFreq(tgt.note, tgt.oct, S.a4));
  drawSounding();
}

// ── 音叉 / 6音 の切替（ボタンひとつ） ──
function setNotes(v) {
  if (S.notes === v) return;
  stopAll();
  S.notes = v;
  save(); draw();
}

function toggleFork() {
  setMode(S.mode === 'fork' ? 'open' : 'fork');
}

// ── 楽器・モード切替 ──
// 楽器を選ぶのは「その楽器の6音を鳴らす」という意思表示なので、音叉ビューから
// 抜ける。おかげで音叉/Guitar/Bass はどれかひとつだけが点く 1 行になる。
function setInst(v) {
  if (S.inst === v && S.mode !== 'fork') return;
  stopAll();
  S.inst = v;
  S.mode = 'open';
  save(); draw();
}
function setMode(v) {
  if (S.mode === v) return;
  stopAll();
  S.mode = v;
  save(); draw();
}

// ── A4 ──
function setA4(v) {
  S.a4 = v;
  document.getElementById('a4r').value = v;
  document.getElementById('a4v').textContent = v + ' Hz';
  // 再生中の音程をなめらかに更新（モードに合った note/oct を使う）
  if (osc && S.playing) {
    osc.frequency.setTargetAtTime(
      calcFreq(S.playing.note, S.playing.oct, v),
      ctx.currentTime, 0.01
    );
  }
  drawSounding();
  save();
}
function stepA4(d) { setA4(Math.min(446, Math.max(432, S.a4 + d))); }

// ── 音量 ──
function setVol(v) {
  S.vol = v / 100;
  document.getElementById('volr').value = v;
  document.getElementById('volv').textContent = v + '%';
  if (gain) {
    const t = ctx.currentTime;
    // cancelで前のスケジュールを破棄してから指数追従
    // setTargetAtTime は連続呼び出しでも衝突しないのでノイズが出ない
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.setTargetAtTime(S.vol, t, 0.03);
  }
  save();
}
function stepVol(d) {
  const v = Math.min(100, Math.max(0, Math.round(S.vol * 100) + d));
  setVol(v);
  document.getElementById('volr').value = v;
}

// ── 描画 ──
function setPressed(id, on) {
  const el = document.getElementById(id);
  el.classList.toggle('on', on);
  el.setAttribute('aria-pressed', String(on));
}

// 鳴っている状態を映すものはまとめて更新する。
function drawSounding() {
  drawStrings();
  drawFork();
}

function drawFork() {
  const on = Boolean(S.playing && S.playing.id === FORK_A.id);
  document.getElementById('forkBtn').classList.toggle('on', on);
  document.getElementById('forkBtn').setAttribute('aria-pressed', String(on));
  document.getElementById('forkStage').classList.toggle('on', on);
  document.getElementById('forkNote').textContent = FORK_A.note + FORK_A.oct;
  document.getElementById('forkHz').textContent =
    calcFreq(FORK_A.note, FORK_A.oct, S.a4).toFixed(1) + ' Hz';
  document.getElementById('forkHint').textContent = on ? '鳴っています — タップで止める' : 'タップで鳴らす';
}

// 骨組みは楽器が変わったときだけ作る。A4 や音量のたびに innerHTML を差し替える
// と、押していた弦ボタンごと作り直されてフォーカスが飛んでいた。
let stringsBuiltFor = null;

function buildStrings() {
  document.getElementById('sg').innerHTML = PRESETS[S.inst].map((str) => `
    <div class="sitem" data-n="${str.n}">
      <button class="sbtn" type="button" onclick="clickStr(${str.n})" aria-pressed="false">
        <span class="sn">${str.n}弦</span>
        <span class="sk"></span>
      </button>
      <span class="sf"></span>
    </div>`).join('');
  stringsBuiltFor = S.inst;
}

function drawStrings() {
  if (stringsBuiltFor !== S.inst) buildStrings();
  for (const str of PRESETS[S.inst]) {
    const item = document.querySelector(`.sitem[data-n="${str.n}"]`);
    if (!item) continue;
    const tgt = getTarget(str);
    const id  = tgt.note + tgt.oct + '_' + str.n;
    const on  = Boolean(S.playing && S.playing.id === id);
    // 表示ラベルは鳴る音そのもの（表示と実音を一致させる）
    item.querySelector('.sk').textContent = tgt.note + tgt.oct;
    item.querySelector('.sf').textContent = calcFreq(tgt.note, tgt.oct, S.a4).toFixed(1) + 'Hz';
    item.classList.toggle('on', on);
    const button = item.querySelector('.sbtn');
    button.classList.toggle('on', on);
    button.setAttribute('aria-pressed', String(on));
  }
}

function draw() {
  // 音叉ビューは弦を選ばないので弦ボタンだけ隠す。切替ボタンが楽器行に
  // 入っているので、行そのものは常に出しておく。
  const simple = S.mode === 'fork';
  document.getElementById('forkStage').classList.toggle('show', simple);
  document.getElementById('sg').style.display = simple ? 'none' : '';
  document.getElementById('btn-guitar').classList.toggle('on', !simple && S.inst === 'guitar');
  document.getElementById('btn-bass').classList.toggle('on',   !simple && S.inst === 'bass');
  // 基準音/実音は各弦を鳴らすときだけの選択なので、音叉ビューでは出さない。
  document.getElementById('notes-row').style.display = simple ? 'none' : '';
  setPressed('btn-ref',  S.notes === 'ref');
  setPressed('btn-real', S.notes === 'real');
  const forkBtn = document.getElementById('btn-mode');
  forkBtn.classList.toggle('on', simple);
  forkBtn.setAttribute('aria-pressed', String(simple));
  document.getElementById('a4r').value  = S.a4;
  document.getElementById('a4v').textContent = S.a4 + ' Hz';
  document.getElementById('volr').value = Math.round(S.vol * 100);
  document.getElementById('volv').textContent = Math.round(S.vol * 100) + '%';
  drawSounding();
}

// ── localStorage ──
const KEY = 'web-tuning-fork-v1';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      inst:S.inst, mode:S.mode, notes:S.notes, a4:S.a4, vol:S.vol,
    }));
  } catch(e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (d.inst === 'guitar' || d.inst === 'bass')   S.inst = d.inst;
    // 'a' は音叉ビューの旧 ID
    if (d.mode === 'a')    S.mode = 'fork';
    if (d.mode === 'fork' || d.mode === 'open') S.mode = d.mode;
    if (d.notes === 'real' || d.notes === 'ref') S.notes = d.notes;
    if (typeof d.a4  === 'number' && d.a4  >= 432 && d.a4  <= 446) S.a4  = d.a4;
    if (typeof d.vol === 'number' && d.vol >= 0   && d.vol <= 1)   S.vol = d.vol;
  } catch(e) {}
}

// ── 起動 ──
load();
draw();
</script>
</body>
